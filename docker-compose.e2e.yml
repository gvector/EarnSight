# Stack usa-e-getta per i test end-to-end (`make e2e`): segreti e credenziali di test,
# volumi propri, solo il front-end esposto (porta 18080). Si sovrappone a docker-compose.yml.
x-test-env: &test-env
  DATABASE_URL: postgresql+asyncpg://earnsight:earnsight@postgres:5432/earnsight
  REDIS_URL: redis://redis:6379/0
  DATA_DIR: /data
  SECRET_KEY: e2e-secret-key-not-for-production-0123456789abcdef
  AUTH_USERNAME: admin
  AUTH_PASSWORD: e2e-password-not-for-production

services:
  postgres:
    # credenziali fisse: Compose interpolerebbe i POSTGRES_* del .env dell'utente
    environment:
      POSTGRES_USER: earnsight
      POSTGRES_PASSWORD: earnsight
      POSTGRES_DB: earnsight
    ports: !reset []
  redis:
    ports: !reset []
  api:
    env_file: !reset []
    environment: *test-env
    ports: !reset []
    volumes: !override
      - e2e-data:/data
  worker:
    env_file: !reset []
    environment: *test-env
    volumes: !override
      - e2e-data:/data
  frontend:
    ports: !override
      - "18080:8080"

volumes:
  e2e-data:
