# EarnSight: SPA statica + proxy /api verso il backend (stesso dominio, niente CORS).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # upload fino a MAX_UPLOAD_MB (10 MB, .env) più il margine del multipart:
    # oltre risponde nginx con 413 prima di toccare l'API. Va tenuto allineato
    # a MAX_UPLOAD_MB (vedi .env.example).
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno di Docker: se il container api cambia IP, nginx lo ritrova
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # llm-resolve può attendere il provider fino a 120 s
        proxy_read_timeout 180s;
        include /etc/nginx/security-headers.conf;
    }

    # asset con hash nel nome: immutabili
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA: ogni percorso non statico serve index.html, mai in cache
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
}
