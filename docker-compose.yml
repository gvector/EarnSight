services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-earnsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-earnsight}
      POSTGRES_DB: ${POSTGRES_DB:-earnsight}
    # solo da questa macchina (psql, api/worker lanciati fuori da Docker)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-earnsight}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    # Ollama gira sull'host: Docker Desktop risolve già host.docker.internal, su Linux serve
    # questo (e Ollama in ascolto oltre 127.0.0.1, es. OLLAMA_HOST=0.0.0.0)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build: ./backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    # Lo schema nasce da Alembic (mai da create_all): prima migrazione, poi serve.
    # exec: uvicorn prende il posto di sh e riceve direttamente il SIGTERM di docker stop
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build: ./backend
    env_file: .env
    volumes:
      - ./data:/data
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    # SPA React servita da nginx non-root; nginx inoltra /api al servizio api
    restart: unless-stopped
    build: ./frontend
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
